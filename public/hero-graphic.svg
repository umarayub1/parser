<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background elements -->
  <rect x="50" y="50" width="500" height="300" rx="20" fill="#F6F8FB" stroke="#D1D9E6" stroke-width="2"/>
  
  <!-- Bank statement elements -->
  <rect x="80" y="80" width="250" height="40" rx="6" fill="#E2E8F0"/>
  <rect x="80" y="140" width="200" height="15" rx="3" fill="#E2E8F0"/>
  <rect x="80" y="165" width="240" height="15" rx="3" fill="#E2E8F0"/>
  
  <!-- Transaction rows -->
  <rect x="80" y="200" width="400" height="1" fill="#CBD5E0"/>
  <rect x="80" y="220" width="100" height="12" rx="2" fill="#E2E8F0"/>
  <rect x="200" y="220" width="150" height="12" rx="2" fill="#E2E8F0"/>
  <rect x="400" y="220" width="60" height="12" rx="2" fill="#4361EE" opacity="0.6"/>
  
  <rect x="80" y="240" width="400" height="1" fill="#CBD5E0"/>
  <rect x="80" y="260" width="100" height="12" rx="2" fill="#E2E8F0"/>
  <rect x="200" y="260" width="130" height="12" rx="2" fill="#E2E8F0"/>
  <rect x="400" y="260" width="45" height="12" rx="2" fill="#F72585" opacity="0.6"/>
  
  <rect x="80" y="280" width="400" height="1" fill="#CBD5E0"/>
  <rect x="80" y="300" width="100" height="12" rx="2" fill="#E2E8F0"/>
  <rect x="200" y="300" width="170" height="12" rx="2" fill="#E2E8F0"/>
  <rect x="400" y="300" width="70" height="12" rx="2" fill="#4361EE" opacity="0.6"/>
  
  <!-- Data transformation elements -->
  <path d="M400 150 L450 150 L450 250 L400 250" stroke="#4361EE" stroke-width="2" stroke-dasharray="5 5"/>
  
  <!-- Structured data result -->
  <rect x="350" y="100" width="180" height="180" rx="10" fill="#FFFFFF" stroke="#4361EE" stroke-width="2"/>
  <rect x="370" y="120" width="140" height="10" rx="2" fill="#4CC9F0" opacity="0.6"/>
  <rect x="370" y="140" width="100" height="10" rx="2" fill="#4CC9F0" opacity="0.6"/>
  <rect x="370" y="160" width="120" height="10" rx="2" fill="#4CC9F0" opacity="0.6"/>
  
  <!-- JSON brackets -->
  <text x="360" y="195" font-family="monospace" font-size="20" fill="#3A0CA3">{</text>
  <text x="370" y="215" font-family="monospace" font-size="16" fill="#4361EE">"data": [...]</text>
  <text x="360" y="235" font-family="monospace" font-size="20" fill="#3A0CA3">}</text>
  
  <!-- Animation elements -->
  <circle cx="320" cy="170" r="15" fill="#4361EE" opacity="0.2">
    <animate attributeName="r" values="15;20;15" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="170" r="8" fill="#4361EE" opacity="0.4">
    <animate attributeName="r" values="8;12;8" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Data flow indicators -->
  <path d="M300 170 L340 170" stroke="#4361EE" stroke-width="2">
    <animate attributeName="stroke-dashoffset" values="10;0" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Icons -->
  <circle cx="500" cy="80" r="15" fill="#F72585" opacity="0.8"/>
  <text x="495" y="85" font-family="Arial" font-size="14" fill="white">$</text>
</svg> 
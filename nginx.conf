events {
    worker_connections 1024; # Default, adjust if needed
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Use standard log files in Alpine Linux (docker-entrypoint.sh will tail these to stdout/stderr)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log info;

    server {
        listen 80; # Nginx will listen on this port inside the container
        server_name localhost; # Or your domain

        # Serve frontend static files
        location / {
            root   /app/dist; # Path to your built frontend assets
            index  index.html index.htm;
            try_files $uri $uri/ /index.html; # Important for Single Page Applications
        }

        # Proxy API requests to the backend
        # Requests to Nginx like GET /api/users will be proxied to http://localhost:4000/api/users
        location /api/ {
            proxy_pass http://localhost:4000; # Backend listens on 4000 internally

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Optional: You can add gzip compression, logging, etc. here
        # gzip on;
        # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # access_log /var/log/nginx/access.log;
        # error_log /var/log/nginx/error.log;
    }
}
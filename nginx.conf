events {
    worker_connections 1024; # Default, adjust if needed
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Use standard log files in Alpine Linux (docker-entrypoint.sh will tail these to stdout/stderr)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log info;

    # Define upstream backend with better error handling
    upstream backend {
        server localhost:4000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80; # Nginx will listen on this port inside the container
        server_name localhost; # Or your domain

        # Serve frontend static files
        location / {
            root   /app/dist; # Path to your built frontend assets
            index  index.html index.htm;
            try_files $uri $uri/ /index.html; # Important for Single Page Applications
        }

        # Proxy API requests to the backend with improved settings
        location /api/ {
            proxy_pass http://backend;
            
            # Connection settings
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Retry settings
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            # Headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Buffer settings for large requests
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            client_max_body_size 50M;
        }

        # Health check endpoint that bypasses backend if needed
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Optional: You can add gzip compression, logging, etc. here
        # gzip on;
        # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # access_log /var/log/nginx/access.log;
        # error_log /var/log/nginx/error.log;
    }
}